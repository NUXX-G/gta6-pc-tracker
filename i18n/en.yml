faq:
- q: 'Recompilation or compatibility layer: what is the difference?'
  a: 'A compatibility layer (like Wine/Proton) runs the game''s original code and swaps the console''s system libraries for its own. Static recompilation translates the code ahead of time into a new program. On Xbox Series both share a trick: the CPU is x86-64 like a PC, so the CPU code runs almost as is. The hard part is the GPU: its shaders are compiled for the console''s RDNA2 chip and must be translated.'
- q: Why is there no Xbox Series emulator?
  a: Because it is not needed for the CPU and it is very hard for the rest. Emulating the processor would be slow and pointless when the PC already speaks x86-64. The work is in reimplementing the console's system services, its Direct3D 12.X graphics API and translating tens of thousands of GPU shaders.
- q: What does each phase and the percentage mean?
  a: 'Phase 1 prepares shaders and assets (0–25%). Phase 2: the exe starts (25%). Phase 3: first frame (40%). Phase 4: menus (55%). Phase 5: the world loads (70%). Phase 6: world rendered and lit (80%). Phase 7: playable at around 30 fps (90%), stable (100%). A partially reached phase counts half-way. The rules live in config/scoring.yml.'
- q: What GPU do I need?
  a: 'There is no official answer. Here is what the projects themselves say:'
- q: Is there an official PC port?
  a: Not announced. Until an official source confirms it, treat any date as rumour.
- q: Why is every download a scam?
  a: None of these projects distributes the game, and the serious ones refuse to explain how to get it. Anyone offering 'GTA 6 PC' as a ready-made file is offering, at best, a pirated leak, and very often malware or a phishing trap. We never link files, torrents or hosting sites.
- q: How do you rate credibility?
  a: 'Green: the project''s own README or commits, or a reproduction by a tracker or a second PC. Yellow: specialised press or threads with evidence. Red: anonymous posts or rumour language. ⛔: rumour plus something technically impossible given the known state; it counts for nothing.'
glossary:
- term: Shader
  def: A small program that runs on the GPU to draw geometry, colour and light. Console shaders are compiled for the console's chip and must be translated.
- term: Recomp
  def: 'Static recompilation: translating a program''s machine code ahead of time into new code for another platform.'
- term: Compatibility layer
  def: Software that answers the calls a program expects from its original system, so it can run unchanged elsewhere (like Wine/Proton).
- term: D3D12
  def: Direct3D 12, Microsoft's low-level graphics API. The console uses a variant, D3D12.X.
- term: Vulkan
  def: A cross-platform low-level graphics API, an alternative to D3D12.
- term: wave64
  def: GPU programs that work in groups of 64 threads. AMD runs them natively; NVIDIA and Intel use groups of 32, so they need emulation.
- term: Mesh shader
  def: A modern way to build geometry on the GPU. It needs fairly recent graphics cards.
- term: TDR
  def: 'Timeout Detection and Recovery: Windows resets the graphics driver when the GPU hangs (screens go black for a moment).'
- term: DMCA
  def: A US copyright takedown procedure. GitHub publishes the notices it receives in a public repository.
