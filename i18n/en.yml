faq_extra:
- q: When is GTA 6 coming to PC?
  a: Rockstar has announced no date and no PC version. GTA VI came out on 19 November 2026 only on PS5 and Xbox Series X|S. With GTA V the PC port arrived a year and a half later, and with Red Dead Redemption 2, one year later. What exists today are community projects, none of them playable.
- q: Can I download GTA 6 for PC?
  a: No. There is no PC version, official or community-made. Every site, video or repo offering "GTA 6 PC" to download is a scam or malware. See our fake downloads guide.
- q: Which project is furthest along?
  a: According to the PortWatch tracker, a private build called CGBJ has put a player inside the world, unlit and very slow. Among public projects, VIctory and its derivatives load the world but see it dark. The standings above update every hour.
