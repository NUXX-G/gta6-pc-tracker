faq:
- q: 'Recompilación o capa de compatibilidad: ¿qué diferencia hay?'
  a: 'Una capa de compatibilidad (como Wine/Proton) ejecuta el código original del juego y cambia las bibliotecas de sistema de la consola por unas propias. La recompilación estática traduce el código de antemano a un programa nuevo. En Xbox Series las dos comparten un truco: la CPU es x86-64 como la de un PC, así que el código de CPU corre casi tal cual. Lo difícil es la GPU: sus shaders están compilados para el chip RDNA2 de la consola y hay que traducirlos.'
- q: ¿Por qué no hay un emulador de Xbox Series?
  a: Porque para la CPU no hace falta y para el resto es muy difícil. Emular el procesador sería lento e inútil cuando el PC ya habla x86-64. El trabajo está en reimplementar los servicios de sistema de la consola, su API gráfica Direct3D 12.X y traducir decenas de miles de shaders de GPU.
- q: ¿Qué significa cada fase y el porcentaje?
  a: 'La fase 1 prepara shaders y assets (0–25 %). Fase 2: el exe arranca (25 %). Fase 3: primer frame (40 %). Fase 4: menús (55 %). Fase 5: carga el mundo (70 %). Fase 6: mundo renderizado e iluminado (80 %). Fase 7: jugable a unos 30 fps (90 %), estable (100 %). Una fase alcanzada en parte cuenta a medio camino. Las reglas están en config/scoring.yml.'
- q: ¿Qué GPU hace falta?
  a: 'No hay respuesta oficial. Esto es lo que dicen los propios proyectos:'
- q: ¿Hay un port oficial?
  a: No está anunciado. Hasta que lo confirme una fuente oficial, cualquier fecha es un rumor.
- q: ¿Por qué toda descarga es una estafa?
  a: Ninguno de estos proyectos distribuye el juego, y los serios se niegan a explicar cómo conseguirlo. Quien te ofrece "GTA 6 PC" como archivo listo para usar te ofrece, en el mejor caso, una filtración pirata y muy a menudo malware o una trampa de phishing. Nunca enlazamos archivos, torrents ni webs de alojamiento.
- q: ¿Cómo clasificáis la credibilidad?
  a: 'Verde: el README o los commits del propio proyecto, o una reproducción de un tracker o un segundo PC. Amarillo: prensa especializada o hilos con evidencia. Rojo: posts anónimos o lenguaje de rumor. ⛔: rumor más algo técnicamente imposible según el estado conocido; no cuenta para nada.'
glossary:
- term: Shader
  def: Programa pequeño que corre en la GPU para dibujar geometría, color y luz. Los de consola están compilados para su chip y hay que traducirlos.
- term: Recomp
  def: 'Recompilación estática: traducir de antemano el código máquina de un programa a código nuevo para otra plataforma.'
- term: Capa de compatibilidad
  def: Software que responde a las llamadas que un programa espera de su sistema original, para que funcione sin cambios en otro (como Wine/Proton).
- term: D3D12
  def: Direct3D 12, la API gráfica de bajo nivel de Microsoft. La consola usa una variante, D3D12.X.
- term: Vulkan
  def: API gráfica de bajo nivel multiplataforma, alternativa a D3D12.
- term: wave64
  def: Programas de GPU que trabajan en grupos de 64 hilos. AMD los ejecuta de forma nativa; NVIDIA e Intel usan grupos de 32, así que necesitan emulación.
- term: Mesh shader
  def: Forma moderna de generar geometría en la GPU. Exige tarjetas gráficas bastante recientes.
- term: TDR
  def: 'Timeout Detection and Recovery: Windows reinicia el driver gráfico cuando la GPU se cuelga (las pantallas se quedan en negro un momento).'
- term: DMCA
  def: Procedimiento de retirada por derechos de autor de EE. UU. GitHub publica los avisos que recibe en un repositorio público.
