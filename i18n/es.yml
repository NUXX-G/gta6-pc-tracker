faq_extra:
- q: ¿Cuándo sale GTA 6 para PC?
  a: Rockstar no ha anunciado fecha ni versión de PC. GTA VI salió el 19 de noviembre de 2026 solo en PS5 y Xbox Series X|S. Con GTA V el port de PC llegó un año y medio después, y con Red Dead Redemption 2, uno. Lo que hay hoy son proyectos de la comunidad, ninguno jugable.
- q: ¿Puedo descargar GTA 6 para PC?
  a: No. No existe ninguna versión de PC, ni oficial ni de la comunidad. Toda web, vídeo o repo que ofrece "GTA 6 PC" para descargar es una estafa o malware. Mira nuestra guía de descargas falsas.
- q: ¿Qué proyecto va más avanzado?
  a: VIctory y sus derivados (como AnyXboxX) y Palmwave cargan el mundo, pero aún lo ven oscuro o de un color plano y van a segundos por frame. Ninguno es jugable. La clasificación de arriba se actualiza cada hora.
