# "How it works" guide for players. Our own words; no game content. Figures are inline SVGs (templates/figures.html).
es:
  title: "Cómo funciona un port de GTA 6 a PC, explicado para jugadores"
  description: "Qué es un emulador, una capa de compatibilidad y una recompilación; por qué un juego de Xbox Series no arranca en PC sin más, qué son los shaders y por qué es tan difícil. Sin tecnicismos."
  eyebrow: "Guía para jugadores"
  h1: "Cómo funciona todo esto (sin tecnicismos)"
  lead: "Si te preguntas qué hacen exactamente VIctory, XCL y compañía, por qué unos dicen \"recomp\" y otros \"capa de compatibilidad\", y por qué ver un menú no significa que puedas jugar, esta es la guía. Diez minutos de lectura y entenderás las noticias mejor que la mitad de los comentarios de YouTube."
  toc: "En esta guía"
  sections:
    - id: "que-es-un-juego"
      h: "1. Qué hay dentro de un juego"
      figure: anatomy
      paras:
        - "Un juego como GTA VI son, a grandes rasgos, tres cosas. La primera es el ejecutable: el \"cerebro\", millones de instrucciones que le dicen al procesador (CPU) qué hacer en cada momento: física, inteligencia de los personajes, lógica de juego, cargar cosas del disco."
        - "La segunda son los assets: modelos 3D, texturas, sonidos, vídeos y mapas, guardados en archivos enormes y comprimidos. Es la mayor parte de los más de 100 GB que ocupa."
        - "La tercera, y la que más guerra da, son los shaders: miles de programas pequeños que corren en la tarjeta gráfica (GPU) y deciden cómo se pinta cada píxel, cómo cae la luz, cómo se ven el agua o los reflejos."
        - "Ninguna de las tres funciona sola. El juego le pide cosas al sistema operativo y al hardware a través de bibliotecas (piezas de software del sistema) y de una API gráfica, que es el idioma con el que el juego le habla a la GPU."
    - id: "por-que-no-arranca"
      h: "2. Por qué un juego de Xbox no arranca en tu PC sin más"
      figure: stack
      paras:
        - "La buena noticia: la Xbox Series tiene por dentro un procesador AMD de la familia x86-64, la misma que la de tu PC. El cerebro del juego habla, literalmente, el mismo idioma que tu CPU. Por eso nadie necesita emular el procesador, y por eso esto avanza mucho más rápido que con consolas antiguas."
        - "La mala noticia: todo lo que hay alrededor del cerebro es distinto."
      bullets:
        - "**Otro sistema operativo.** La consola usa un Windows recortado y muy modificado, con sus propias bibliotecas (el kit de Microsoft para Xbox se llama GDK). El juego llama a funciones que en tu PC no existen."
        - "**Otra API gráfica.** En Xbox se usa Direct3D 12.X, una versión de consola de DirectX 12 que deja al juego tocar la GPU mucho más de cerca. En PC hay que traducirla a DirectX 12 normal o a Vulkan."
        - "**Shaders ya compilados.** En PC, los juegos traen sus shaders en un formato intermedio y tu driver los termina de compilar para tu tarjeta (por eso ves pantallas de \"compilando shaders\"). En consola vienen ya convertidos en código máquina para su GPU exacta, una AMD RDNA2. Tu NVIDIA o tu AMD de PC no entienden ese código tal cual."
        - "**Memoria compartida.** La consola tiene 16 GB que comparten CPU y GPU. Tu PC tiene la RAM por un lado y la VRAM de la gráfica por otro, unidas por un bus mucho más lento. Si el juego deja datos de la GPU en el sitio equivocado, todo va a cámara lenta."
        - "**Archivos a su manera.** Las texturas se guardan con un orden de píxeles (\"tiling\") pensado para esa GPU y comprimidas con un formato propio (BCPack) que la consola descomprime con hardware dedicado. En PC hay que hacerlo por software."
      callout: "Resumen: el código de CPU corre casi gratis. Todo el trabajo está en fingir ser una Xbox: sus servicios, su API gráfica, su memoria y, sobre todo, sus shaders."
    - id: "tres-caminos"
      h: "3. Los tres caminos: emulador, capa de compatibilidad y recompilación"
      figure: routes
      paras:
        - "Cuando lees sobre estos proyectos aparecen siempre tres palabras. No son sinónimos."
      cards:
        - title: "Emulador"
          tag: "lento pero universal"
          text: "Un programa que imita el hardware entero de la consola, instrucción a instrucción, como PCSX2 con PS2 o Dolphin con GameCube. Funciona con cualquier juego, pero imitar un procesador cuesta muchísima potencia. Con Xbox Series no tiene sentido emular la CPU, porque tu PC ya habla su idioma; por eso casi nadie va por aquí, aunque algunos proyectos usen la palabra \"emulador\" por costumbre."
        - title: "Capa de compatibilidad"
          tag: "el camino de casi todos"
          text: "Como Wine o Proton, que permiten jugar juegos de Windows en Linux y Steam Deck. El código del juego corre tal cual en tu CPU, y la capa se hace pasar por el sistema de la consola: cuando el juego pide \"dame la memoria de la GPU\" o \"dibuja esto\", la capa responde con el equivalente de PC. VIctory, XCL, OpenScarlett, PercyScarlett o TuxBox van por aquí."
        - title: "Recompilación estática"
          tag: "traducir de antemano"
          text: "Traducir el programa entero a otro programa nuevo antes de ejecutarlo, como hicieron N64Recomp o UnleashedRecomp con juegos de Nintendo 64 y Xbox 360. El resultado puede ir muy fino, pero exige entender cada rincón del ejecutable. Con un procesador que ya es compatible, varios proyectos que empezaron como \"recomp\" (G6Recomp, por ejemplo) se han pasado al enfoque de capa."
      after: "Y luego está el cuarto camino, el único jugable de verdad a largo plazo: el port oficial, hecho por Rockstar con el código fuente. Ese no depende de nada de esto."
    - id: "shaders"
      h: "4. Los shaders: el gran muro"
      figure: shaders
      paras:
        - "Si has seguido las noticias habrás visto cifras como \"26.503 shaders\". Es el paquete de programas de GPU del juego, y cada uno viene en código máquina de la GPU de la consola. Para que tu tarjeta lo ejecute, los proyectos tienen que leer ese código instrucción a instrucción, entender qué hace y reescribirlo en un formato de PC (DXIL para DirectX 12 o SPIR-V para Vulkan). Después tu driver lo compila como cualquier otro juego."
        - "No basta con traducir: hay que traducir bien. Un shader de luz mal traducido no da error, simplemente pinta negro. Por eso tantos proyectos llegan al mundo y lo ven oscuro o de un solo color: la geometría está ahí, pero los pasos de iluminación aún no salen bien."
      bullets:
        - "**wave64 contra wave32.** La GPU de la consola trabaja con grupos de 64 hilos. Las NVIDIA usan grupos de 32. Muchos shaders del juego dan por hecho los 64, así que en NVIDIA hay que simularlo con dos mitades que cooperan. En AMD de PC funciona de forma nativa."
        - "**Mesh shaders.** El mundo se dibuja con una técnica moderna llamada mesh shaders. Hace falta una gráfica relativamente reciente (en NVIDIA, de la serie RTX 20 en adelante; en AMD, RDNA2 en adelante)."
        - "**Tiempo de compilación.** Algunos shaders del mundo son gigantes y el driver tarda minutos en compilarlos. Mientras tanto el juego cree que se ha colgado y se cierra solo, o Windows reinicia el driver."
    - id: "rendimiento"
      h: "5. Por qué \"carga el mundo\" no significa \"se puede jugar\""
      paras:
        - "Ver un menú es un gran hito, pero es la parte fácil: una imagen 2D y unos pocos shaders. El mundo abierto es otra liga: miles de objetos, streaming constante desde el disco, luces, sombras y reflejos, todo 30 veces por segundo."
        - "Hoy los proyectos más avanzados tardan entre medio segundo y varios minutos en pintar un solo frame del mundo. Para jugar hacen falta unos 33 milisegundos por frame (30 fps). Es decir, hay que ir entre 15 y miles de veces más rápido, y esa optimización es el tramo más largo."
      bullets:
        - "**TDR.** Si la GPU tarda más de 2 segundos en una tarea, Windows cree que se ha colgado y reinicia el driver: pantallazo negro un momento y el juego se cierra."
        - "**El vigilante del propio juego.** GTA VI comprueba que su hilo principal da señales de vida. Si pasa medio minuto sin hacerlo (por ejemplo, compilando shaders), se cierra a sí mismo."
        - "**La memoria.** Si los datos que lee la GPU están en la RAM del PC en vez de en la VRAM, cada acceso cruza el bus y todo va cientos de veces más lento."
    - id: "fases"
      h: "6. Qué significa cada fase de nuestro tracker"
      figure: phases
      paras:
        - "Dividimos el camino en siete fases con nombre de golpe, porque a esto se le parece: preparar, entrar, mirar, moverse dentro y salir con el botín. Cada una tiene un porcentaje fijo y documentado, y una fase alcanzada a medias cuenta a medio camino."
      phases: true
      after: "La fase la decidimos a mano a partir de lo que publica cada proyecto y de lo que reproducen los trackers independientes. Si un README promete más de lo que podemos confirmar, lo marcamos como afirmación pendiente."
    - id: "legal"
      h: "7. ¿Es legal? ¿Lo puedo probar yo?"
      paras:
        - "Los proyectos de código abierto no incluyen nada del juego: solo su propio código. Todos piden que pongas tu propia copia, y los serios se niegan a explicar cómo conseguirla. El problema es que, hoy, la única forma de tener el ejecutable de Xbox en un PC es una filtración: alguien lo publicó sin permiso el 23 de noviembre. Usarlo es piratería, y no lo enlazamos ni lo enlazaremos."
        - "Además, ninguno es jugable todavía. Para probar algo hace falta compilar el proyecto desde el código fuente, tener una gráfica moderna y muchísima paciencia para ver, como mucho, unos menús. No es una experiencia para jugar, es un experimento."
      callout: "Y sobre todo: ninguno de estos proyectos se descarga como \"GTA 6 PC listo para jugar\". Si ves eso, es una estafa. Lee nuestra guía de descargas falsas."
      callout_link: fake
    - id: "port-oficial"
      h: "8. ¿Y el port oficial?"
      paras:
        - "Rockstar no ha anunciado versión de PC. Históricamente, sus grandes juegos han llegado a PC tiempo después que a consolas: GTA V tardó un año y medio (septiembre de 2013 en consolas, abril de 2015 en PC) y Red Dead Redemption 2, alrededor de un año (octubre de 2018 y noviembre de 2019)."
        - "Un port oficial se hace con el código fuente original, así que no tiene ninguno de los muros de esta guía. Por eso, si llega, será la forma buena de jugar en PC. Los proyectos de la comunidad son, sobre todo, una demostración técnica impresionante y una forma de aprender cómo funciona una consola moderna."
