en:
  title: "How a GTA 6 PC port works, explained for players"
  description: "What an emulator, a compatibility layer and a recompilation are; why an Xbox Series game does not just run on PC, what shaders are and why it is so hard. No jargon."
  eyebrow: "A guide for players"
  h1: "How all this works (no jargon)"
  lead: "If you wonder what VIctory, XCL and friends actually do, why some say \"recomp\" and others \"compatibility layer\", and why seeing a menu does not mean you can play, this is the guide. Ten minutes of reading and you will understand the news better than half the YouTube comments."
  toc: "In this guide"
  sections:
    - id: "inside-a-game"
      h: "1. What is inside a game"
      figure: anatomy
      paras:
        - "A game like GTA VI is, roughly, three things. The first is the executable: the \"brain\", millions of instructions telling the processor (CPU) what to do at every moment: physics, character AI, game logic, loading things from disk."
        - "The second is the assets: 3D models, textures, sounds, videos and maps, stored in huge compressed archives. That is most of the 100+ GB it takes up."
        - "The third, and the most troublesome, is the shaders: thousands of small programs that run on the graphics card (GPU) and decide how every pixel is painted, how light falls, how water and reflections look."
        - "None of the three works alone. The game asks the operating system and the hardware for things through libraries (pieces of system software) and a graphics API, the language the game uses to talk to the GPU."
    - id: "why-it-does-not-run"
      h: "2. Why an Xbox game does not just run on your PC"
      figure: stack
      paras:
        - "The good news: inside, the Xbox Series has an AMD processor of the x86-64 family, the same as your PC. The game's brain literally speaks the same language as your CPU. That is why nobody needs to emulate the processor, and why this moves much faster than with older consoles."
        - "The bad news: everything around the brain is different."
      bullets:
        - "**Another operating system.** The console runs a cut-down, heavily modified Windows with its own libraries (Microsoft's Xbox kit is called the GDK). The game calls functions that do not exist on your PC."
        - "**Another graphics API.** Xbox uses Direct3D 12.X, a console version of DirectX 12 that lets the game touch the GPU much more directly. On PC it has to be translated into regular DirectX 12 or Vulkan."
        - "**Shaders already compiled.** On PC, games ship their shaders in an intermediate format and your driver finishes compiling them for your card (that is why you see \"compiling shaders\" screens). On console they arrive already turned into machine code for its exact GPU, an AMD RDNA2. Your PC's NVIDIA or AMD card cannot read that code as it is."
        - "**Shared memory.** The console has 16 GB shared by the CPU and GPU. Your PC has RAM on one side and the graphics card's VRAM on the other, joined by a much slower bus. If the game leaves GPU data in the wrong place, everything crawls."
        - "**Files its own way.** Textures are stored with a pixel order (\"tiling\") designed for that GPU and compressed with its own format (BCPack), which the console unpacks with dedicated hardware. On PC it has to be done in software."
      callout: "In short: CPU code runs almost for free. All the work is in pretending to be an Xbox: its services, its graphics API, its memory and, above all, its shaders."
    - id: "three-roads"
      h: "3. The three roads: emulator, compatibility layer and recompilation"
      figure: routes
      paras:
        - "Three words come up whenever you read about these projects. They are not synonyms."
      cards:
        - title: "Emulator"
          tag: "slow but universal"
          text: "A program that imitates the console's whole hardware, instruction by instruction, like PCSX2 for PS2 or Dolphin for GameCube. It works with any game, but imitating a processor costs a huge amount of power. With the Xbox Series there is no point emulating the CPU, because your PC already speaks its language; that is why almost nobody takes this road, even if some projects use the word \"emulator\" out of habit."
        - title: "Compatibility layer"
          tag: "the road almost everyone takes"
          text: "Like Wine or Proton, which let you play Windows games on Linux and Steam Deck. The game's code runs as it is on your CPU, and the layer pretends to be the console's system: when the game asks \"give me GPU memory\" or \"draw this\", the layer answers with the PC equivalent. VIctory, XCL, OpenScarlett, PercyScarlett and TuxBox take this road."
        - title: "Static recompilation"
          tag: "translate ahead of time"
          text: "Translating the whole program into a new program before running it, as N64Recomp and UnleashedRecomp did with Nintendo 64 and Xbox 360 games. The result can run very smoothly, but it requires understanding every corner of the executable. With a processor that is already compatible, several projects that started as a \"recomp\" (G6Recomp, for example) have switched to the layer approach."
      after: "And then there is the fourth road, the only truly playable one in the long run: the official port, made by Rockstar with the source code. That one depends on none of this."
    - id: "shaders"
      h: "4. Shaders: the big wall"
      figure: shaders
      paras:
        - "If you follow the news you will have seen figures like \"26,503 shaders\". That is the game's pack of GPU programs, and each one comes as machine code for the console's GPU. For your card to run it, the projects have to read that code instruction by instruction, understand what it does and rewrite it in a PC format (DXIL for DirectX 12 or SPIR-V for Vulkan). Then your driver compiles it like any other game."
        - "Translating is not enough: it has to be translated right. A badly translated lighting shader does not throw an error, it just paints black. That is why so many projects reach the world and see it dark or a single colour: the geometry is there, but the lighting passes do not come out right yet."
      bullets:
        - "**wave64 versus wave32.** The console's GPU works in groups of 64 threads. NVIDIA cards use groups of 32. Many of the game's shaders assume 64, so on NVIDIA it has to be simulated with two cooperating halves. On PC AMD cards it works natively."
        - "**Mesh shaders.** The world is drawn with a modern technique called mesh shaders. You need a fairly recent graphics card (NVIDIA RTX 20 series or newer; AMD RDNA2 or newer)."
        - "**Compile time.** Some world shaders are giants and the driver takes minutes to compile them. Meanwhile the game thinks it has hung and closes itself, or Windows resets the driver."
    - id: "performance"
      h: "5. Why \"loads the world\" does not mean \"playable\""
      paras:
        - "Seeing a menu is a big milestone, but it is the easy part: a 2D image and a few shaders. The open world is another league: thousands of objects, constant streaming from disk, lights, shadows and reflections, all 30 times a second."
        - "Today the most advanced projects take between half a second and several minutes to paint a single world frame. To play you need about 33 milliseconds per frame (30 fps). In other words, it has to get between 15 and thousands of times faster, and that optimisation is the longest stretch."
      bullets:
        - "**TDR.** If the GPU takes more than 2 seconds on a task, Windows thinks it has hung and resets the driver: a moment of black screen and the game closes."
        - "**The game's own watchdog.** GTA VI checks that its main thread shows signs of life. If half a minute goes by without one (for example, while compiling shaders), it closes itself."
        - "**Memory.** If the data the GPU reads sits in the PC's RAM instead of VRAM, every access crosses the bus and everything runs hundreds of times slower."
    - id: "phases"
      h: "6. What each phase of our tracker means"
      figure: phases
      paras:
        - "We split the road into seven phases named after a heist, because that is what it looks like: prepare, get in, look around, move inside and walk out with the loot. Each has a fixed, documented percentage, and a phase reached in part counts half-way."
      phases: true
      after: "We set the phase by hand from what each project publishes and what independent trackers reproduce. If a README promises more than we can confirm, we flag it as a pending claim."
    - id: "legal"
      h: "7. Is it legal? Can I try it?"
      paras:
        - "The open-source projects contain nothing from the game: only their own code. All of them ask you to supply your own copy, and the serious ones refuse to explain how to get it. The problem is that, today, the only way to have the Xbox executable on a PC is a leak: someone published it without permission on 23 November. Using it is piracy, and we do not and will not link it."
        - "Besides, none is playable yet. To try anything you have to build the project from source, have a modern graphics card and a lot of patience to see, at most, some menus. It is not a way to play, it is an experiment."
      callout: "Above all: none of these projects downloads as \"GTA 6 PC ready to play\". If you see that, it is a scam. Read our fake downloads guide."
      callout_link: fake
    - id: "official-port"
      h: "8. What about the official port?"
      paras:
        - "Rockstar has not announced a PC version. Historically, its big games have reached PC some time after consoles: GTA V took a year and a half (September 2013 on consoles, April 2015 on PC) and Red Dead Redemption 2 about a year (October 2018 and November 2019)."
        - "An official port is made with the original source code, so it has none of the walls in this guide. If it arrives, it will be the right way to play on PC. The community projects are, above all, an impressive technical demonstration and a way to learn how a modern console works."
