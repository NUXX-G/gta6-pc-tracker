    goal_en: "Run Xbox Series games natively on Windows and Linux from your own copy."
    approach_es: "Capa de compatibilidad: sustituye las DLL de sistema de la consola por DLL con el mismo nombre construidas sobre Win32 y Direct3D 12 de PC; en Linux corre bajo Wine con vkd3d-proton."
    approach_en: "Compatibility layer: replaces the console's system DLLs with same-named DLLs built on Win32 and PC Direct3D 12; on Linux it runs under Wine with vkd3d-proton."
    technical_es: "Traduce código máquina de GPU a HLSL (compute, pixel, vertex, mesh y geometry); trazado de rayos en curso; mandos, teclado y ratón; DirectStorage con zlib. Minecraft Preview es jugable a unos 60 fps y la demo técnica de Matrix con UE5 corre a unos 20 fps."
    technical_en: "Translates GPU machine code to HLSL (compute, pixel, vertex, mesh and geometry); ray tracing in progress; gamepads, keyboard and mouse; DirectStorage with zlib. Minecraft Preview is playable at about 60 fps and the UE5 Matrix tech demo runs at about 20 fps."
    requirements_es: "Windows 10/11 o Linux con Wine; probado sobre todo en RTX 5090."
    requirements_en: "Windows 10/11 or Linux with Wine; tested mostly on an RTX 5090."
    kind: layer
    article_es:
      - "OpenScarlett (Community Edition) es una capa de compatibilidad general para juegos de Xbox Series, independiente del otro OpenScarlett pese al nombre. \"Scarlett\" es el nombre en clave del hardware de Xbox Series."
      - "Su truco es el de los sustitutos: cuando el juego busca las bibliotecas de la consola (gráficos, servicios, mando, almacenamiento), encuentra unas con el mismo nombre que por dentro llaman a Windows. En Linux hace lo mismo encima de Wine, como Proton con los juegos de Steam."
      - "Ya es jugable con Minecraft Preview a unos 60 fps y corre la demo de Matrix con Unreal Engine 5. Con el juego reciente que no nombra pasa los ajustes, las pantallas legales y la pantalla de inicio a 30 fps, reproduce el vídeo 4K con sonido y se para al cargar la escena de los menús."
      - "Qué vigilar: los menús. Es de los pocos proyectos con una base probada en varios juegos y además apunta a Linux."
    article_en:
      - "OpenScarlett (Community Edition) is a general compatibility layer for Xbox Series games, separate from the other OpenScarlett despite the name. \"Scarlett\" is the codename of the Xbox Series hardware."
      - "Its trick is stand-ins: when the game looks for the console's libraries (graphics, services, gamepad, storage), it finds same-named ones that call Windows inside. On Linux it does the same on top of Wine, like Proton does with Steam games."
      - "It is already playable with Minecraft Preview at about 60 fps and runs the Unreal Engine 5 Matrix demo. With the newer game it does not name, it gets through settings, legal screens and the start screen at 30 fps, plays the 4K video with sound, and stops while loading the scene behind the menus."
