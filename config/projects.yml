  - name: "Palmwave"
    slug: palmwave
    repo: fablinoo/palmwave
    language: "Rust"
    priority: 10
    phase: {level: 5, partial: false,
            note_es: "Con el detector de cuelgues y dos pasadas de iluminación desactivadas por parches, entra en el mundo y presenta sus frames, pero se ven de un solo color plano; cada frame del mundo tarda de 18 s a 2 min de GPU.",
            note_en: "With the hang detector and two lighting passes patched off, it enters the world and presents its frames, but they are one flat colour; each world frame takes 18 s to 2 min of GPU work."}
    goal_es: "Ejecutar juegos de Xbox Series en Windows partiendo de XCL, con arreglos propios para GTA VI."
    goal_en: "Run Xbox Series games on Windows starting from XCL, with fixes of its own for GTA VI."
    approach_es: "Fork de XCL: código x64 nativo, APIs de consola reimplementadas y shaders RDNA2 traducidos a HLSL y DXIL para Direct3D 12, más parches de bytes aplicados en memoria al cargar."
    approach_en: "XCL fork: native x64 code, reimplemented console APIs and RDNA2 shaders translated to HLSL and DXIL for Direct3D 12, plus byte patches applied in memory at load time."
    technical_es: "Prepara en segundo plano las pipelines de cálculo del mundo; implementa wave64 en GPU de 32 hilos con dos mitades cooperando; herramientas para cronometrar cada draw y volcar frames. Mide 58.759 pipelines creadas antes de cargar el mundo."
    technical_en: "Builds the world's compute pipelines on background threads; implements wave64 on 32-lane GPUs with two cooperating halves; tools to time every draw and dump frames. It measures 58,759 pipelines created before the world loads."
    requirements_es: "Windows 10/11 x64, Rust con MSVC, Windows SDK con DXC, Gaming Services y GPU con SM 6.6 y mesh shaders."
    requirements_en: "Windows 10/11 x64, Rust with MSVC, Windows SDK with DXC, Gaming Services and a GPU with SM 6.6 and mesh shaders."
    kind: layer
    based_on: [xcl]
    article_es:
      - "Palmwave es un fork de XCL con arreglos propios, hecho con ayuda de una plataforma de IA según su propio README. Su interés está en que documenta con mucho detalle lo que pasa al entrar en el mundo con la base de XCL."
      - "Para llegar más lejos aplica parches de bytes en memoria (sin tocar el archivo en disco): apaga el detector de cuelgues del juego, que lo cierra si no recibe señales durante 30 segundos, y dos pasadas de iluminación cuyos shaders son enormes."
      - "Así entra en el mundo, pero la imagen es un único color plano y cada frame tarda entre 18 segundos y 2 minutos. El motivo principal: más de 4 GB de memoria de GPU del juego viven en la RAM del PC y la tarjeta la lee a través del bus, cientos de veces más lento."
      - "Qué vigilar: si logra mover esa memoria a la VRAM sin pasarse de los 16 GB de la tarjeta, y si los parches que apagan partes del juego dejan de hacer falta."
    article_en:
      - "Palmwave is an XCL fork with fixes of its own, made with help from an AI platform according to its README. What makes it interesting is how thoroughly it documents what happens when XCL's base enters the world."
      - "To get further it applies byte patches in memory (the file on disk is left alone): it switches off the game's hang detector, which closes it after 30 seconds without a heartbeat, and two lighting passes whose shaders are huge."
      - "That way it enters the world, but the picture is a single flat colour and each frame takes between 18 seconds and 2 minutes. The main reason: over 4 GB of the game's GPU memory lives in the PC's RAM and the card reads it across the bus, hundreds of times slower."
      - "What to watch: whether it can move that memory into VRAM without going over the card's 16 GB, and whether the patches that switch parts of the game off stop being needed."
    strengths:
      - {es: "Mediciones muy precisas de qué frena cada frame del mundo.", en: "Very precise measurements of what slows each world frame.", evidence: "https://github.com/fablinoo/palmwave#status"}
      - {es: "Hereda la base de XCL, que ya ejecuta otros juegos completos.", en: "Inherits XCL's base, which already runs other full games.", evidence: "https://github.com/ivall/xcl"}
    weaknesses:
      - {es: "Necesita parches que apagan partes del juego para avanzar.", en: "Needs patches that switch parts of the game off to progress.", evidence: "https://github.com/fablinoo/palmwave#status"}
      - {es: "El mundo no se ve todavía y la VRAM se queda corta.", en: "The world is not visible yet and VRAM runs short.", evidence: "https://github.com/fablinoo/palmwave#status"}

