  - name: "Holy-Interoperability"
    slug: holy-interoperability
    repo: mewiof/Holy-Interoperability
    language: "C++"
    priority: 15
    phase: {level: 3, partial: false,
            note_es: "Con un título que no nombra, presenta sus primeros frames unos 30 s después de arrancar; el dispositivo gráfico a veces se pierde y no se ha visto nada de lo que dibuja.",
            note_en: "With a title it does not name, it presents its first frames about 30 s after starting; the graphics device is sometimes lost and nothing it draws has been seen."}
    goal_es: "Ejecutar paquetes de juegos x64 de consola como procesos nativos de Windows, sin emulación."
    goal_en: "Run x64 console title packages as native Windows processes, with no emulation."
    approach_es: "Arranca el ejecutable suspendido y sustituye en memoria su tabla de importaciones por su propio runtime; reimplementa las bibliotecas de consola en sala limpia."
    approach_en: "Starts the executable suspended and swaps its import table in memory for its own runtime; reimplements the console libraries clean-room."
    technical_es: "Sandbox de baja integridad, enlazador de importaciones que avisa de cada función que falta, memoria xmem, dispositivo d3d12_xs sobre D3D12 de PC, almacenamiento rápido con zlib. Mide el avance como cobertura de bibliotecas de consola."
    technical_en: "Low-integrity sandbox, an import binder that reports each missing function, xmem memory, a d3d12_xs device on PC D3D12, fast storage with zlib. It measures progress as console-library coverage."
    requirements_es: "Windows 10/11 x64, CMake, Ninja y clang-cl o Visual Studio 2022."
    requirements_en: "Windows 10/11 x64, CMake, Ninja and clang-cl or Visual Studio 2022."
    kind: layer
    article_es:
      - "Holy-Interoperability es una capa de compatibilidad en fase temprana con una filosofía muy cuidadosa: no nombra juegos, no toca nada en disco y ejecuta el título dentro de una sandbox que le impide escribir en tus archivos."
      - "Su método: arranca el ejecutable en pausa y, antes de dejarlo correr, cambia en memoria la lista de bibliotecas que el juego pide por la suya. Así cada llamada acaba en Windows, en una DLL del propio juego o en una reimplementación del proyecto, y si falta algo lo dice con precisión."
      - "Con un título reciente carga, inicializa sus servicios, crea ventana y dispositivo gráfico y presenta sus primeros frames a los 30 segundos. Después se para en el arranque del reproductor de vídeo y nada de lo que dibuja se ha visto aún."
      - "Qué vigilar: su cobertura de bibliotecas de consola, el número que el propio proyecto usa para medir su avance."
    article_en:
      - "Holy-Interoperability is an early compatibility layer with a very careful philosophy: it names no games, changes nothing on disk and runs the title inside a sandbox that stops it writing to your files."
      - "Its method: it starts the executable paused and, before letting it run, swaps in memory the list of libraries the game asks for with its own. Each call then ends up in Windows, in one of the game's DLLs or in a project reimplementation, and anything missing is reported precisely."
      - "With a recent title it loads, starts its services, creates its window and graphics device and presents its first frames after 30 seconds. It then stops in its video player's start-up, and nothing it draws has been seen yet."
      - "What to watch: its console-library coverage, the number the project itself uses to measure progress."
    strengths:
      - {es: "Diseño muy seguro: sandbox y nada se modifica en disco.", en: "Very safe design: sandboxed, nothing changed on disk.", evidence: "https://github.com/mewiof/Holy-Interoperability#how-it-works"}
      - {es: "Bien cubierto de tests de extremo a extremo.", en: "Well covered by end-to-end tests.", evidence: "https://github.com/mewiof/Holy-Interoperability#status"}
    weaknesses:
      - {es: "Primeros frames, pero nada visible todavía.", en: "First frames, but nothing visible yet.", evidence: "https://github.com/mewiof/Holy-Interoperability#status"}
      - {es: "Comunidad muy pequeña.", en: "Very small community.", evidence: "https://github.com/mewiof/Holy-Interoperability"}

