      - "g6shim se toma el problema como una lista de tareas: primero escanea el juego y apunta cada función de consola que ni Windows ni el propio juego aportan; después genera una DLL con huecos para cada una y los va rellenando."
      - "Su barra de progreso es muy visual: carga al 100 %, memoria al 95 %, audio al 80 %, shaders al 75 % y gráficos al 40 %. El juego arranca, abre todos sus archivos y se para justo donde empiezan los gráficos."
      - "Qué vigilar: el primer frame, que es su siguiente hito declarado."
    article_en:
      - "g6shim treats the problem as a to-do list: first it scans the game and notes every console function that neither Windows nor the game itself provides; then it generates a DLL with gaps for each one and fills them in."
      - "Its progress bar is very visual: loading at 100%, memory at 95%, audio at 80%, shaders at 75% and graphics at 40%. The game starts, opens all its archives and stops right where graphics begin."
      - "What to watch: the first frame, its declared next milestone."
