  - name: Palmetto
    slug: palmetto
    repo: luizwidmer/palmetto
    language: Python
    priority: 9
    phase: {level: 2, partial: false,
            note_es: "El ejecutable arranca y llega al código de render, pero aún no completa ningún frame.",
            note_en: "The executable boots and reaches its render code, but has not completed a frame yet."}
    goal_es: "Runtime de sala limpia que ejecuta la versión de Xbox Series en Windows; continúa el Leonida original tras quedar privado."
    goal_en: "Clean-room runtime that runs the Xbox Series build on Windows; carries on the original Leonida after it went private."
    # Note: often described as an XCL fork, but GitHub reports fork=false and its README says it continues Leonida.
    approach_es: "Lleva adelante el runtime de Leonida: imagen PE mapeada, shims de importación y D3D12 de consola sobre Vulkan."
    approach_en: "Carries Leonida's runtime forward: mapped PE image, import shims and console D3D12 on Vulkan."
    technical_es: "11.986 llamadas D3D12 en un arranque con 0 fallos de pipeline; 26.616 módulos SPIR-V indexados; 29 de 29 programas FidelityFX traducidos. Se detiene en un puntero nulo dentro del código de render que está investigando."
    technical_en: "11,986 D3D12 calls in a boot with 0 pipeline failures; 26,616 SPIR-V modules indexed; 29 of 29 FidelityFX programs translated. It stops on a null pointer inside render code that is under investigation."
    requirements_es: "Unos 400 GiB libres, Python 3.12, .NET 8, Visual Studio 2022, Vulkan SDK y LLVM con target AMDGPU."
    requirements_en: "About 400 GiB free, Python 3.12, .NET 8, Visual Studio 2022, Vulkan SDK and LLVM with the AMDGPU target."
    strengths:
      - {es: "Mediciones muy detalladas de dónde se para y por qué.", en: "Very detailed measurements of where it stops and why.", evidence: "https://github.com/luizwidmer/palmetto#status"}
      - {es: "0 fallos de creación de pipelines en el arranque medido.", en: "0 pipeline creation failures in the measured boot.", evidence: "https://github.com/luizwidmer/palmetto#status"}
    weaknesses:
      - {es: "Todavía no presenta ningún frame.", en: "No presented frame yet.", evidence: "https://github.com/luizwidmer/palmetto#status"}
      - {es: "Comunidad pequeña y requisitos de compilación muy pesados.", en: "Small community and very heavy build requirements.", evidence: "https://github.com/luizwidmer/palmetto#build"}
