# Global settings. The base path lives ONLY here.
site:
  url: "https://nuxx-g.github.io"      # origin, no trailing slash
  base_path: "/gta6-pc-tracker/"        # every route, asset, sitemap, canonical, hreflang and RSS uses this
  repo: "NUXX-G/gta6-pc-tracker"
  languages: [es, en]
  default_language: en
  show_thumbnails: false                 # external previews never load on their own: the viewer clicks to reveal them

# Live counters on the home page (UTC). Shown as "time since"; the leaked file itself is never linked.
milestones:
  console_launch: "2026-11-19T00:00:00Z"   # GTA VI launch on PS5 and Xbox Series X|S
  exe_leak: "2026-11-23T14:36:00Z"         # the Xbox Series executable was published by Cyberleek
  exe_leak_by: "Cyberleek"
  exe_leak_source: "https://www.xda-developers.com/gta-6-xbox-executable-leaked-opening-door-for-pc-recompilation-projects-begin-testing/"

# Media catalogue: every image/video that passes the legal filter is listed, labelled by origin and credibility.
media:
  max_items: 60
  readme_max_per_project: 6
  youtube_queries:
    - "gta 6 pc port"
    - "gta vi pc port progress"
    - "gta 6 victory xcl pc"
    - "gta 6 xbox recompilation pc"
    - "gta 6 cgbj in game"
    - "gta 6 running on pc"
    - "gta 6 boots on pc"
    - "gta 6 in game on pc footage"
    - "gta 6 pc port gameplay"
    - "gta 6 victory running"
    - "gta 6 xcl running"
  youtube_max_per_query: 12
  youtube_days: 10
  skip_image_patterns: ["shields.io", "badge", "/badges/", "sponsor", "paypal", "ko-fi", "kofi", "discord", "logo", "mascot", "banner", "favicon", "opengraph.githubassets.com", "architecture", "diagram", "progress"]
  # Strict relevance: an image/video is listed only if ITS OWN text (title, alt text, caption, README section heading)
  # names GTA VI and is about PC / the ports, and none of these appear. Whole words, case-insensitive.
  other_games: ["minecraft", "matrix", "keanu", "fortnite", "trackmania", "terraria", "undertale", "dragon ball", "rayman",
    "puyo", "roblox", "halo", "forza", "starfield", "cyberpunk", "red dead", "rdr2?", "gta ?(5|v|iv|4)", "gta san andreas",
    "san andreas", "vice city stories", "xdefiant", "freedoom", "doom", "call of duty", "warzone", "fifa", "ea fc",
    "simpletriangle", "simple triangle", "lanes", "frosty", "unreal engine", "ue5", "tomb raider", "skyrim", "palworld",
    "the finals", "hogwarts", "spider-?man", "mafia", "watch dogs", "saints row", "sleeping dogs"]
  junk_terms: ["download", "descarga", "descargar", "free", "gratis", "apk", "android", "ios", "mobile", "móvil", "movil",
    "crack", "repack", "giveaway", "sorteo", "how to get", "cómo conseguir", "como conseguir", "install", "instalar",
    "trailer", "reaction", "reacción", "reaccion", "leaked gameplay", "map size", "how to play", "full guide", "right now", "all locations", "easter egg",
    "money", "dinero", "cheats", "trucos", "mod menu", "funny", "meme", "#shorts", "shorts", "prank", "ai generated", "ia",
    "ost", "music", "música", "musica", "soundtrack", "song", "radio", "dlss 5"]
  # Posts (PRs/issues) that read like bug reports are not progress captures.
  error_terms: ['error', 'errors', 'crash\w*', 'exception', '0x[0-9a-f]+', 'fail\w*', 'not working', "doesn'?t work",
    'help', 'bug', 'broken', 'stuck', 'hangs?', 'freez\w*', 'tdr', 'device removed']
  # "Progress footage" only: the text must also describe the game running on PC (booting, menus, in-game, frames...)
  # and must not read as commentary/news/speculation. Regexes, whole words, case-insensitive. A "?" in a title rejects it.
  footage_terms: ["run(s|ning)?", "boot(s|ed|ing)?", "menus?", "main menu", "title screen", "start screen", "in[- ]?game",
    "first (frame|screen|picture)", "frames?", "footage", "gameplay", "showcase", "tested", "testing", "loading", "loads?",
    "fps", "render(s|ed|ing)?", "playing", "walking", "driving", "screenshots?", "captured?", "on screen", "the world",
    "world loads?", "progress", "works?", "working", "arranca", "menú", "menús", "funcionando", "corriendo", "en partida"]
  commentary_terms: ["news", "noticias", "explained", "explains?", "explainer", 'fact[- ]?check\w*', "really", "reaction",
    "reacts?", "will", "could", "may", "might", "when", "coming", "release date", "rumou?rs?", "race", "tracker",
    "24/7", 'leak\w*', 'filtra\w*', "dropped", "taken down", "shut down", "why", "what", "opinion", "podcast", "should",
    "can my pc", "can your pc", "specs", "requirements", "theory", "predictions?", "vs", "versus", "exploded", "breaking",
    "rockstar is", "sooner", "early", "finally here", "catch", "is here"]
  # Projects whose whole README is about GTA VI: a screenshot there needs no "GTA" in its caption (other games still excluded).
  gta_only_projects: [victory, five-star-recomp, gta6-boottest, leonida-continued, leonida-reforge, palmetto, g6recomp, cgbj, palmwave]

http:
  user_agent: "gta6-pc-tracker/1.0 (+https://github.com/NUXX-G/gta6-pc-tracker)"
  timeout_s: 20
  max_bytes: 4000000
  retries: 3
  backoff_s: 2.0
  min_interval_s:
    default: 0.5
    api.github.com: 0.15
    www.reddit.com: 2.0
    old.reddit.com: 2.0
    reddit.com: 2.0
    hn.algolia.com: 1.0
    mastodon.social: 2.0
    lemmy.world: 2.0
    public.api.bsky.app: 2.0
    news.google.com: 2.0
    www.youtube.com: 2.0

github:
  forks_to_check: 4                 # most-starred forks per tracked project run through the clone detector
  problem_keywords: [crash, hang, tdr, "black screen", nvidia, wave64, "device removed", freeze]
  stale_hours: 48

discovery:
  terms:
    - "gta vi pc"
    - "gta6 pc"
    - "gta6 recomp"
    - "gta vi recompilation"
    - "xbox series recompilation"
    - "xbox series emulator"
    - "gdk compatibility layer"
    - "scarlett emulator"
    - "game_scarlett_master"
  pushed_within_days: 14
  max_candidates: 25
  inspect_top: 25

reddit:
  subreddits: [pcgaming, GTA6, emulation, GamingLeaksAndRumours, GTA]
  query: "(gta 6 OR gta vi OR gta6) (pc OR port OR victory OR xcl OR leonida OR recomp)"
  weekly_min_score: 100
  weekly_min_comments: 20

social:
  hn_queries: ["GTA 6 PC", "GTA VI PC", "GTA 6 recomp", "GTA 6 port"]
  bluesky_queries: ["gta6 pc port", "gta vi pc port"]
  mastodon_tags: [gta6, gtavi]
  lemmy_queries: ["gta 6 pc", "gta vi pc"]
  relevance_terms: [pc, port, recomp, victory, xcl, leonida, palmetto, xbox2windows, emulat, "compatibility layer", "five star recomp", anyxboxx, cgbj, palmwave, openscarlett, percyscarlett, tuxbox, g6recomp, g6shim, xvalkyrie]

news:
  google_news:
    - {lang: es, url: "https://news.google.com/rss/search?q=GTA+6+PC+port&hl=es&gl=ES&ceid=ES:es"}
    - {lang: en, url: "https://news.google.com/rss/search?q=GTA+6+PC+port&hl=en-US&gl=US&ceid=US:en"}
  publisher_feeds:
    - {lang: en, url: "https://www.notebookcheck.net/News.152.100.html"}
    - {lang: en, url: "https://videocardz.com/feed"}
    - {lang: en, url: "https://www.dsogaming.com/feed/"}
    - {lang: en, url: "https://www.pcgamer.com/rss/"}
    - {lang: en, url: "https://www.videogameschronicle.com/feed/"}
    - {lang: en, url: "https://www.eurogamer.net/feed"}
    - {lang: en, url: "https://www.gamesradar.com/feeds/all/"}
    - {lang: en, url: "https://wccftech.com/feed/"}
    - {lang: en, url: "https://www.tomshardware.com/feeds/all"}
    - {lang: en, url: "https://www.xda-developers.com/feed/"}
    - {lang: en, url: "https://www.windowscentral.com/feeds/all"}
    - {lang: en, url: "https://www.pcgamesn.com/mainrss.xml"}
    - {lang: en, url: "https://kotaku.com/rss"}
    - {lang: es, url: "https://www.3djuegos.com/feedburner.xml"}
    - {lang: es, url: "https://vandal.elespanol.com/xml.cgi"}
    - {lang: es, url: "https://www.hobbyconsolas.com/rss"}
    - {lang: es, url: "https://www.vidaextra.com/feedburner.xml"}
    - {lang: es, url: "https://www.xataka.com/feedburner.xml"}
    - {lang: es, url: "https://www.eurogamer.es/feed"}
  # Headlines with any of these (case-insensitive substrings) are dropped: guides, in-game places/characters, gameplay tips.
  exclude_terms: ["how to", "guide", "guía", "cómo conseguir", "trucos", "cheats", "códigos", "codes", "easter egg", "money", "dinero", "port gellhorn", "lucia", "jason", "vice city", "leonida keys", "best settings", "all locations", "ubicaci"]
  show_press_headlines: true   # press headlines pass the legal + spoiler filters and are shown (forum titles never are)
  keywords: ["gta 6", "gta vi", "gta6"]
  # Whole-word regexes (case-insensitive): an article must be about PC / the ports, not just mention the game.
  context_terms: ['pc', 'ports?', 'porting', 'portado', 'recomp\w*', 'recompila\w*', 'emulat\w*', 'emulador\w*', 'executable', 'ejecutable', 'victory', 'xcl', 'leonida', 'cgbj', 'palmwave', 'openscarlett', 'percyscarlett', 'tuxbox', 'compatibility layer', 'capa de compatibilidad']

trackers:
  - {name: "GTA VI PC Race", url: "https://vuyp.github.io/gta6-pc-race/"}
  - {name: "PortWatch VI", url: "https://portwatch-vi.xyz/", json: "https://portwatch-vi.xyz/data/tracker.json"}
  - {name: "mtwildwood GTA 6 PC", url: "https://gta.mtwildwood.net/es/gta-6-pc/"}

health:
  warn_after_hours: 6

history:
  hourly_days: 7

ui:
  news_visible: 3
  links_visible: 5
  history_visible: 20
